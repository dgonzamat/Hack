name: Retrain ML classifier

on:
  push:
    branches: [master]
    paths:
      - 'train_clasificador.py'
  schedule:
    - cron: '0 3 * * 0'   # Domingo 3am UTC — reentrenar semanalmente
  workflow_dispatch:        # Disparo manual desde GitHub Actions UI

permissions:
  contents: write           # Necesario para commit del pkl actualizado

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Instalar dependencias ML
        run: pip install scikit-learn pytest

      - name: Evaluar modelo actual (CV)
        run: python train_clasificador.py --eval

      - name: Reentrenar y guardar pkl
        run: python train_clasificador.py

      - name: Verificar tests con nuevo modelo
        run: |
          pip install -r requirements.txt || true
          python -m pytest test_cubicador.py -q

      - name: Commit pkl actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add clasificador_recintos.pkl
          if git diff --staged --quiet; then
            echo "pkl sin cambios — nada que commitear"
          else
            git commit -m "chore(ml): retrain clasificador_recintos.pkl [skip ci]"
            git push origin master
          fi
